name: frameon
description: LED matrix frame editor — design, preview, and send animations to your device.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1

  # Unique IDs for layers
  uuid: ^4.3.3

  # Image / GIF decoding (wired in next phase)
  image: ^4.1.7

  # File picker for GIF/image upload
  file_picker: ^9.2.3

  # NTP for time sync 
  ntp: ^2.0.0
  
  # HTTP client for device communication
  http: ^1.2.1

  # URL launcher for opening device web interface
  url_launcher: ^6.3.0
  
  # For hashing animations before sending to device
  crypto: ^3.0.3

  # Serial communication (Windows / macOS)
  flutter_libserialport: ^0.6.0   # uncomment when wiring device transport
    
  #
  window_manager: ^0.5.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

